<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰拉瑞亚 - ZZH的个人网页</title>
    <link rel="stylesheet" href="assets/css/terraria.css">
</head>

<body>
    <header>
        <h1>泰拉瑞亚</h1>
        <p>Boss 召唤顺序与 NPC 资料整理</p>
    </header>

    <main class="container">
        <section class="intro">
            <h2>攻略整理</h2>
            <p>把你整理的表格信息整理为网页，方便随时查看 Boss 召唤方式与 NPC 出现条件。</p>
        </section>

        <section class="section">
            <h3>攻略表格</h3>
            <div class="tab-buttons" role="tablist" aria-label="泰拉瑞亚表格切换">
                <button class="tab-button active" type="button" data-target="boss-panel">Boss 顺序与召唤方式</button>
                <button class="tab-button" type="button" data-target="npc-panel">NPC 资料</button>
            </div>
            <div class="table-panel active" id="boss-panel">
                <div id="boss-table"></div>
            </div>
            <div class="table-panel" id="npc-panel">
                <div id="npc-table"></div>
            </div>
        </section>

        <a class="back-link" href="index.html">返回首页</a>
    </main>

    <footer>
        <p>© 2024 ZZH. All rights reserved.</p>
    </footer>
    <script src="assets/js/terraria.js" defer></script>
</body>

</html>
