name: Sync Steam data

on:
  schedule:
    # 00:17 UTC = 08:17 Asia/Shanghai.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'PorryZ/PorryZ.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Fetch Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID64: ${{ secrets.STEAM_ID64 }}
        run: node scripts/sync-steam.mjs

      - name: Check game cards
        run: node scripts/test-game-cards.cjs

      - name: Commit and push Steam data
        run: |
          git add data/steam.json
          if git diff --cached --quiet; then
            echo "Steam data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Steam data"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Write run summary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('data/steam.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${data.summary}\n\nUpdated: ${data.lastUpdated}\n`);
          NODE
